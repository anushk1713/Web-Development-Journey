<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Forms for applaying UR journey</h1>
    <form action="post"></form>
    <div>
        <label for="username">Enter user name</label>
        <input type="text" id="username" name="username" placeholder="username" autofocus>
    </div>
    <div>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
    </div>
    <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">Subscribe for more information</label>
    </div>
    <div>
        <label for="comment">Enter ur comment</label>
        <br>
        <textarea name="comment" id="comment" rows="4" cols="50"></textarea>
    </div>
    <div>
        <select name="Countries">
            <option value="India">India</option>
            <option value="SouthArica">SouthArica</option>
            <option value="Japan">Japan</option>
            <option value="Newzland">Newzland</option>
        </select>
        
    </div>

</body>
</html>
